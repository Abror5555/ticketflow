# PostgreSQL for local development and tests.
# Host port 5434 is used so it does not clash with a locally installed PostgreSQL on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: ticketflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketflow
    ports:
      - "5434:5432"
    volumes:
      - ticketflow-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticketflow-data:
